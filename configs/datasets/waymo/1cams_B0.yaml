# Waymo dataset configuration — B0 baseline variant
#
# Same as 1cams.yaml except all dynamic classes are routed to RigidNodes,
# so streetgs.yaml trains pedestrians and cyclists as rigid Gaussian objects
# (matching the original Street Gaussians paper's treatment, where ALL
# dynamic objects are rigid).
#
# Default 1cams.yaml routes Pedestrian -> SMPLNodes and Cyclist -> Deformable;
# since streetgs.yaml only enables RigidNodes, those classes get silently
# dropped. Use this config to construct the true B0 baseline.

data:
  data_root: data/waymo/processed/training
  dataset: waymo
  scene_idx: 0
  start_timestep: 0
  end_timestep: -1
  preload_device: cuda
  pixel_source:
    type: datasets.waymo.waymo_sourceloader.WaymoPixelSource
    cameras: [0]
    downscale_when_loading: [1]
    downscale: 1
    undistort: True
    test_image_stride: 0
    load_sky_mask: True
    load_dynamic_mask: True
    load_objects: True
    load_smpl: False  # B0 routes all classes to RigidNodes; no SMPL data needed
    object_class_node_mapping:
      Vehicle: RigidNodes
      Pedestrian: RigidNodes
      Cyclist: RigidNodes
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3
  lidar_source:
    type: datasets.waymo.waymo_sourceloader.WaymoLiDARSource
    load_lidar: True
    only_use_top_lidar: False
    truncated_max_range: 80
    truncated_min_range: -2
    lidar_downsample_factor: 4
    lidar_percentile: 0.02
