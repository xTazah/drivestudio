# Waymo dataset configuration — 3-cam B0 baseline variant
#
# Same as 3cams.yaml except all dynamic classes are routed to RigidNodes,
# matching the 1cam B0 protocol but with the front + 2 side cameras.
# downscale_when_loading=[2,2,2] (half res per cam) keeps VRAM in budget.

data:
  data_root: data/waymo/processed/training
  dataset: waymo
  scene_idx: 0
  start_timestep: 0
  end_timestep: -1
  preload_device: cuda
  pixel_source:
    type: datasets.waymo.waymo_sourceloader.WaymoPixelSource
    cameras: [0, 1, 2]
    downscale_when_loading: [2, 2, 2]
    downscale: 1
    undistort: True
    test_image_stride: 0
    load_sky_mask: True
    load_dynamic_mask: True
    load_objects: True
    load_smpl: True
    object_class_node_mapping:
      Vehicle: RigidNodes
      Pedestrian: RigidNodes
      Cyclist: RigidNodes
    sampler:
      buffer_downscale: 8
      buffer_ratio: 0.5
      start_enhance_weight: 3
  lidar_source:
    type: datasets.waymo.waymo_sourceloader.WaymoLiDARSource
    load_lidar: True
    only_use_top_lidar: False
    truncated_max_range: 80
    truncated_min_range: -2
    lidar_downsample_factor: 4
    lidar_percentile: 0.02
